<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phuoc Hung Process OS Module</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f9fa;color:#343a40;font-family:Arial,sans-serif;overflow-x:hidden}.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}.side{display:flex;flex-direction:column;gap:18px;padding:18px 14px;background:#fff;border-right:1px solid #e9ecef}.brand{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid #e9ecef}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:6px;background:#7a4e1d;color:#fff;font-weight:800}.brand b,.brand span{display:block}.brand span,.muted{color:#6c757d}.ctx{padding:12px;border:1px solid #e7d7c1;border-radius:6px;background:#fffaf4}.ctx small,.group,.crumb,.band span,.metric span{color:#7a4e1d;font-size:11px;font-weight:800;text-transform:uppercase}.ctx b{display:block;margin:5px 0}.nav{display:grid;gap:14px}.navsec{display:grid;gap:4px}.nav button,.ico{border:0;background:transparent;color:#6c757d;cursor:pointer}.nav button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:6px;text-align:left}.nav button.active,.nav button:hover{background:#f1ebe4;color:#7a4e1d}.bottom{position:relative;display:flex;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid #e9ecef}.ico{display:grid;place-items:center;width:38px;height:38px;border:1px solid #e7d7c1;border-radius:6px;background:#fffaf4;color:#7a4e1d}.ico.active,.ico:hover{background:#7a4e1d;color:#fff}.switcher{position:absolute;left:0;bottom:48px;width:228px;padding:8px;border:1px solid #e7d7c1;border-radius:8px;background:#fff;box-shadow:0 14px 36px #0002}.switcher b{display:block;padding:4px 10px 8px;color:#7a4e1d;font-size:11px;text-transform:uppercase}.switcher button{display:flex;gap:9px;width:100%;padding:9px 10px;border:0;border-radius:6px;background:#fff;color:#495057;cursor:pointer}.switcher button:hover,.switcher .active{background:#f1ebe4;color:#7a4e1d}.main{min-width:0;padding:18px 24px 28px;overflow-x:hidden}.top{display:flex;gap:14px;align-items:center;margin-bottom:20px}.search{width:min(560px,100%);height:40px;padding:0 14px;border:1px solid #e9ecef;border-radius:6px}.right{display:flex;gap:10px;margin-left:auto}.badge,select{height:34px;border:1px solid #e9ecef;border-radius:6px;background:#fff}.badge{display:flex;align-items:center;gap:7px;padding:0 10px;color:#6c757d;font-size:13px}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:#c89a5b}select{width:220px;padding:0 10px}.title,.band,.head{display:flex;align-items:center}.title{justify-content:space-between;gap:20px;margin-bottom:14px}.title h1{margin:4px 0 5px;font-size:28px}.title p,.band p{margin:0;color:#6c757d}.btn{height:32px;padding:0 14px;border:1px solid #e9ecef;border-radius:6px;background:#fff}.primary{border-color:#7a4e1d;background:#7a4e1d;color:#fff}.band{justify-content:space-between;gap:16px;margin-bottom:12px;padding:14px 16px;border:1px solid #e7d7c1;border-radius:8px;background:#fffaf4}.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.pill{display:inline-flex;min-height:24px;align-items:center;padding:3px 8px;border:1px solid #e7d7c1;border-radius:999px;background:#fff;color:#7a4e1d;font-size:12px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}.metric,.panel{border:1px solid #e9ecef;border-radius:8px;background:#fff}.metric{padding:15px}.metric b{display:block;margin:8px 0 2px;font-size:27px}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.65fr);gap:12px}.panel{min-width:0;padding:16px;overflow:hidden}.span{grid-row:span 2}.head{justify-content:space-between;margin-bottom:14px}.head h2{margin:0;font-size:16px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f8f9fa;color:#495057;font-size:12px;text-align:left;text-transform:uppercase}th,td{padding:14px 16px;border-bottom:1px solid #e9ecef}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f1ebe4;color:#7a4e1d;font-size:12px;font-weight:800}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.list{display:grid;gap:10px;margin:0;padding-left:18px;color:#495057}.db{display:flex;flex-wrap:wrap;gap:8px}.db span{padding:7px 9px;border:1px solid #e9ecef;border-radius:6px;background:#f8f9fa;font:12px Consolas,monospace}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:10;gap:10px;overflow:hidden;border-right:0;border-bottom:1px solid #e9ecef}.brand,.ctx{display:none}.nav{display:flex;gap:8px;overflow-x:auto}.navsec{display:flex;gap:6px;flex:0 0 auto}.group{display:none}.nav button{width:auto;white-space:nowrap}.bottom{margin-top:0}.main{max-width:100vw;padding:14px}.top,.title,.band{align-items:flex-start;flex-wrap:wrap}.right,.pills{width:100%;margin-left:0;justify-content:flex-start}.metrics,.grid{grid-template-columns:1fr}}
</style>

<body>
<div class="app"><aside class="side"><div class="brand"><div class="mark">PH</div><div><b>Phước Hưng</b><span>Process App</span></div></div><div class="ctx"><small id="mode"></small><b id="ctx"></b><span class="muted" id="owner"></span></div><nav class="nav" id="nav"></nav><div class="bottom"><button class="ico" id="proc" aria-label="Switch process">☷</button><button class="ico" id="cfg" aria-label="Switch config app">⚙</button><div class="switcher" id="sw" hidden><b>Module hub</b></div></div></aside><main class="main"><div class="top"><input class="search" id="q" placeholder="Search record, table config, owner..."><div class="right"><span class="badge">Mock data</span><select id="sel"></select></div></div><section class="title"><div><div class="crumb" id="crumb"></div><h1 id="h1"></h1><p id="sub"></p></div><div><button class="btn">☷ Filter</button> <button class="btn primary">+ New record</button></div></section><section class="band"><div><span>Company context</span><b>PHƯỚC HƯNG - Furniture Manufacturing & Export</b><p id="obj"></p></div><div class="pills" id="sheets"></div></section><section class="metrics" id="metrics"></section><section class="grid" id="content"></section></main></div>
<script>
const cfg=[['setting','Setting overview','System setup','⚙'],['project_info','Project info','System setup','ⓘ'],['step','Step','System setup','↳'],['table_index','Table index','System setup','▦'],['navigation_panel','Navigation panel','System setup','☰'],['field_config','Field config','System setup','☷'],['metric_config','Metric config','System setup','◴'],['feedback','Feedback','Resources','✎'],['variable','Variable','Resources','{}']];
const M={item_master:{label:'Item Master',sub:'Chuẩn hóa item, category, photo, đơn vị chuẩn và conversion.',owner:'ERP Admin / Kỹ thuật / Thu mua',obj:'Chuẩn hóa dữ liệu vật tư để đồng bộ mua hàng, kho, sản xuất và costing.',sheets:['📊 Overview','🔹 Item master','⚙ Item category','⚙ Unit conversion','📘 Hướng dẫn điền'],nav:[['overview','Overview','Report','▦'],['dashboard','Dashboard','Report','◴'],['report','Report','Report','▤'],['primary_table','Sản phẩm','Operation','▣'],['category','Danh mục sản phẩm','Business setup','✤'],['unit_conversion','Khởi tạo tỷ lệ chuyển đổi','Business setup','⇄']],kpis:[['Items','741','724 unique items'],['Categories','207','category setup'],['Unit rules','7','conversion rows'],['Data quality','92%','UOM cleanup needed']],cols:['code','name','category','uom','classification','status','owner'],rows:[['ITM-0001','Ván MDF 1220x2440x18mm','Gỗ/Ván','tấm','Raw material','Active','Kỹ thuật'],['ITM-0002','Bản lề inox 304','Phụ kiện','cái','Accessory','Active','Thu mua'],['ITM-0003','Sơn PU clear coat','Hóa chất','lít','Chemical','Need review','Kho'],['ITM-0004','Thùng carton export grade','Giấy/Carton','bộ','Packing','Active','Kho']],db:['item_master','item_categories','unit_conversions']},product_development:{label:'Product Development',sub:'Theo dõi product brief, sample request, BOM draft, trial và approval.',owner:'R&D / Kỹ thuật / Sales',obj:'Giữ vòng đời phát triển mẫu rõ ràng từ brief tới BOM/costing và approval.',sheets:['📊 Overview','Product brief','Sample request','BOM draft','Trial log'],nav:[['overview','Overview','Report','▦'],['dashboard','Dashboard','Report','◴'],['report','Report','Report','▤'],['primary_table','Product brief','Operation','▣'],['sample_request','Sample request','Operation','✧'],['bom','BOM draft','Business setup','▦'],['trial','Trial log','Resources','↳']],kpis:[['Active projects','18','6 priority'],['Sample round','32','12 waiting QC'],['BOM draft','21','8 need cost'],['Approved','9','ready for costing']],cols:['code','product','customer','stage','owner','due','status'],rows:[['PD-2406-001','Bathroom Vanity 36in','US Retailer','BOM draft','R&D','07/06','Active'],['PD-2406-002','Outdoor Dining Set','EU Buyer','Sample round 2','Kỹ thuật','10/06','Need review'],['PD-2406-003','Oak Sideboard','Hospitality','Costing','Sales','12/06','Active'],['PD-2406-004','Wardrobe KD','Distributor','Approved','R&D','15/06','Draft']],db:['product_developments','sample_requests','bom_drafts','trial_logs']},crm:{label:'CRM',sub:'Quản lý account, contact, opportunity, activity và follow-up.',owner:'Sales / Export team',obj:'Theo dõi pipeline khách hàng xuất khẩu và hành động tiếp theo.',sheets:['📊 Overview','Account','Contact','Opportunity','Activity'],nav:[['overview','Overview','Report','▦'],['dashboard','Dashboard','Report','◴'],['report','Report','Report','▤'],['account','Account','Operation','♙'],['opportunity','Opportunity','Operation','◎'],['activity','Activity','Resources','✎']],kpis:[['Accounts','46','US/EU buyers'],['Open opps','19','7 hot'],['Follow-up','31','due this week'],['Quote value','$420k','pipeline']],cols:['code','account','region','stage','owner','next','status'],rows:[['CRM-001','Northstar Home','US','Quote','Sales','Send revised FOB','Active'],['CRM-002','Nordic Living','EU','Sample','Export','Confirm finish sample','Need review'],['CRM-003','Pacific Sourcing','US','Negotiation','Sales','Margin review','Active'],['CRM-004','Maison Contract','EU','Lead','BD','Intro catalog','Draft']],db:['crm_accounts','crm_contacts','crm_opportunities','crm_activities']}};
let S={p:'item_master',mode:'user',v:'primary_table',cv:'setting',q:''};const $=s=>document.querySelector(s),cap=s=>s.replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase());function groups(a){return a.reduce((g,x)=>((g[x[2]]=g[x[2]]||[]).push(x),g),{})}function drawNav(){let a=S.mode==='config'?cfg:M[S.p].nav,act=S.mode==='config'?S.cv:S.v;$('#nav').innerHTML=Object.entries(groups(a)).map(([g,arr])=>`<div class="navsec"><div class="group">${g}</div>${arr.map(x=>`<button class="${act===x[0]?'active':''}" data-id="${x[0]}">${x[3]} <span>${x[1]}</span></button>`).join('')}</div>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.mode==='config'?S.cv=b.dataset.id:S.v=b.dataset.id;render()})}function tbl(cols,rows){return `<table><thead><tr>${cols.map(c=>`<th>${cap(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===3||i===5?`<span class="tag ${c==='Active'?'ok':c==='Need review'?'warn':''}">${c}</span>`:c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}function side(m){return `<div class="panel"><div class="head"><h2>Guardrail style</h2><span>✧</span></div><ul class="list"><li>Clarity over decoration.</li><li>Grouped left navigation mirrors Apps Script.</li><li>Bottom-left icons switch process and config.</li><li>Forms are section-based cards.</li></ul></div><div class="panel"><div class="head"><h2>DB model</h2><span>▣</span></div><div class="db">${['app_modules','app_processes','app_nav_items','app_tables','app_fields',...m.db].map(x=>`<span>${x}</span>`).join('')}</div></div>`}function body(m){if(S.mode==='config'){let rows=[['app_modules','Module hub holds all processes','Process template app','Config'],['app_nav_items','Grouped left nav by process','≡ Nav','Config'],['app_tables','Table index and screen view','Table index','Config'],['app_fields','Field label, order, validation','Template table','Config']];return `<div class="panel span"><div class="head"><h2>${cap(S.cv)} config</h2><span class="pill">Config app</span></div>${tbl(['table','purpose','source','type'],rows)}</div>`}if(['overview','dashboard','report'].includes(S.v))return `<div class="panel span"><div class="head"><h2>${cap(S.v)}</h2><span class="pill">Template latest rule</span></div><p><b>${m.obj}</b></p><p class="muted">Left panel, main content, list view and section form are retained from Apps Script.</p></div>${side(m)}`;let rows=m.rows.filter(r=>r.join(' ').toLowerCase().includes(S.q));let lab=(m.nav.find(x=>x[0]===S.v)||[])[1]||m.label;return `<div class="panel span"><div class="head"><h2>${lab}</h2><span class="pill">Table-first operation</span></div>${tbl(m.cols,rows)}</div>${side(m)}`}function render(){let m=M[S.p],a=S.mode==='config'?cfg:m.nav,lab=(a.find(x=>x[0]===(S.mode==='config'?S.cv:S.v))||[])[1]||'Overview';$('#mode').textContent=S.mode==='config'?'Config app':'User app';$('#ctx').textContent=m.label;$('#owner').textContent=m.owner;$('#cfg').classList.toggle('active',S.mode==='config');$('#crumb').textContent=`Process OS / ${S.mode==='config'?'Config app':'User app'} / ${lab}`;$('#h1').textContent=S.mode==='config'?`${m.label} config`:m.label;$('#sub').textContent=S.mode==='config'?'Module shell giữ tất cả process, mỗi process có user app và config app riêng.':m.sub;$('#obj').textContent=m.obj;$('#sheets').innerHTML=m.sheets.map(x=>`<span class="pill">${x}</span>`).join('');$('#metrics').innerHTML=m.kpis.map(x=>`<div class="metric"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('');$('#content').innerHTML=body(m);drawNav()}Object.keys(M).forEach(k=>{$('#sel').innerHTML+=`<option value="${k}">${M[k].label}</option>`;$('#sw').innerHTML+=`<button data-p="${k}">${M[k].label}</button>`});$('#sel').onchange=e=>{S.p=e.target.value;S.mode='user';S.v='primary_table';render()};$('#proc').onclick=()=>{$('#sw').hidden=!$('#sw').hidden};$('#sw').onclick=e=>{let b=e.target.closest('button');if(!b)return;S.p=b.dataset.p;$('#sel').value=S.p;S.mode='user';S.v='primary_table';$('#sw').hidden=true;render()};$('#cfg').onclick=()=>{S.mode=S.mode==='config'?'user':'config';$('#sw').hidden=true;render()};$('#q').oninput=e=>{S.q=e.target.value.toLowerCase();render()};render();
</script>
</body></html>

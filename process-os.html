<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phuoc Hung Process OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%237A4E1D'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial' font-size='12' font-weight='700' fill='white'%3EPH%3C/text%3E%3C/svg%3E" />
  <style>*{box-sizing:border-box}body{margin:0;background:#f8f9fa;color:#343a40;font-family:Roboto,Inter,Arial,sans-serif}button,input,select{font:inherit}.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}.side{position:relative;display:flex;flex-direction:column;gap:18px;padding:18px 14px;background:#fff;border-right:1px solid #e9ecef}.brand{display:flex;gap:12px;align-items:center;padding:0 6px 14px;border-bottom:1px solid #e9ecef}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:6px;background:#7a4e1d;color:#fff;font-weight:800}.brand strong,.brand span{display:block}.brand span,.ctx small,.sub,.muted{color:#6c757d}.ctx{display:grid;gap:4px;padding:12px;border:1px solid #e7d7c1;border-radius:6px;background:#fffaf4}.ctx span,.band span,.metric span{color:#7a4e1d;font-size:11px;font-weight:800;text-transform:uppercase}.ctx strong{font-size:15px}.nav{display:grid;gap:4px}.nav button,.iconbtn{border:0;background:transparent;color:#6c757d;cursor:pointer}.nav button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:6px;text-align:left}.nav button.active,.nav button:hover{background:#f1ebe4;color:#7a4e1d}.bottom{position:relative;display:flex;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid #e9ecef}.iconbtn{display:grid;place-items:center;width:38px;height:38px;border:1px solid #e7d7c1;border-radius:6px;background:#fffaf4;color:#7a4e1d}.iconbtn.active,.iconbtn:hover{background:#7a4e1d;color:#fff}.switcher{position:absolute;left:0;bottom:48px;z-index:5;width:228px;padding:8px;border:1px solid #e7d7c1;border-radius:8px;background:#fff;box-shadow:0 14px 36px rgba(52,58,64,.16)}.switcher button{display:flex;gap:9px;align-items:center;width:100%;min-height:36px;padding:8px 10px;border:0;border-radius:6px;background:#fff;color:#495057;cursor:pointer}.switcher button.active,.switcher button:hover{background:#f1ebe4;color:#7a4e1d}.main{min-width:0;padding:18px 24px 28px}.top{display:flex;gap:14px;align-items:center;margin-bottom:20px}.search{width:min(560px,100%);height:40px;padding:0 14px;border:1px solid #e9ecef;border-radius:6px;background:#fff}.topright{display:flex;gap:10px;align-items:center;margin-left:auto}.badge,select{height:34px;border:1px solid #e9ecef;border-radius:6px;background:#fff}.badge{display:flex;align-items:center;gap:7px;padding:0 10px;color:#6c757d;font-size:13px}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:#c89a5b}select{width:220px;padding:0 10px}.title,.band,.header{display:flex;align-items:center}.title{justify-content:space-between;gap:20px;margin-bottom:14px}.title h1{margin:0 0 5px;font-size:28px;line-height:1.12}.title p,.band p{margin:0;color:#6c757d;font-size:14px}.actions{display:flex;gap:10px}.btn{display:inline-flex;gap:8px;align-items:center;height:32px;padding:0 14px;border:1px solid #e9ecef;border-radius:6px;background:#fff;cursor:pointer}.btn.primary{border-color:#7a4e1d;background:#7a4e1d;color:#fff}.band{justify-content:space-between;gap:16px;margin-bottom:12px;padding:14px 16px;border:1px solid #e7d7c1;border-radius:8px;background:#fffaf4}.pills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:430px}.pill{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border:1px solid #e7d7c1;border-radius:999px;background:#fff;color:#7a4e1d;font-size:12px;font-weight:800;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}.metric,.panel{border:1px solid #e9ecef;border-radius:8px;background:#fff}.metric{padding:15px}.metric strong{display:block;margin:8px 0 2px;font-size:27px;line-height:1}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.65fr);gap:12px}.panel{min-width:0;padding:16px}.span{grid-row:span 2}.header{justify-content:space-between;gap:12px;margin-bottom:14px}.header h2{margin:0;font-size:16px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f8f9fa;color:#495057;font-size:12px;text-align:left;text-transform:uppercase}th,td{padding:14px 16px;border-bottom:1px solid #e9ecef}.status{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f1ebe4;color:#7a4e1d;font-size:12px;font-weight:800}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.list{display:grid;gap:10px;margin:0;padding-left:18px;color:#495057}.db{display:flex;flex-wrap:wrap;gap:8px}.db span{padding:7px 9px;border:1px solid #e9ecef;border-radius:6px;background:#f8f9fa;font-family:Consolas,monospace;font-size:12px}.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(52,58,64,.3)}.modal.open{display:grid}.dialog{width:min(520px,calc(100vw - 32px));padding:18px;border-radius:8px;background:#fff}.formsec{display:grid;gap:10px;margin:12px 0;padding:14px;border:1px solid #e9ecef;border-radius:8px;background:#f8f9fa}.formsec input,.formsec textarea,.formsec select{width:100%;padding:9px;border:1px solid #e9ecef;border-radius:6px;background:#fff}@media(max-width:980px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:3}.main{padding:14px}.metrics,.grid{grid-template-columns:1fr}.top,.title,.band{align-items:flex-start;flex-wrap:wrap}.topright,.actions,.pills{width:100%;margin-left:0;justify-content:flex-start}}</style>
</head>
<body>
  <div class="app"><aside class="side"><div class="brand"><div class="mark">PH</div><div><strong>Phuoc Hung</strong><span>Process OS</span></div></div><div class="ctx"><span>Current process</span><strong id="ctxName"></strong><small id="ctxOwner"></small></div><nav class="nav" id="nav"></nav><div class="bottom"><button class="iconbtn" id="processBtn" title="Switch process" aria-label="Switch process">☷</button><button class="iconbtn" id="configBtn" title="Switch config app" aria-label="Switch config app">⚙</button><div class="switcher" id="switcher" hidden></div></div></aside><main class="main"><header class="top"><input class="search" id="search" placeholder="Search item, product, customer, table config..." /><div class="topright"><span class="badge">Mock data</span><select id="processSelect"></select></div></header><section class="title"><div><h1 id="title"></h1><p id="subtitle"></p></div><div class="actions"><button class="btn">☷ Filter</button><button class="btn primary" id="newBtn">+ New record</button></div></section><section class="band"><div><span>Company context</span><strong>PHUOC HUNG - Furniture Manufacturing & Export</strong><p>Lean, clear, table-first process app following Apps Script template: left panel, main content, list view, section forms.</p></div><div class="pills" id="sheets"></div></section><section class="metrics" id="metrics"></section><section class="grid" id="content"></section></main></div><div class="modal" id="modal"><div class="dialog"><h2>Section-based form</h2><div class="formsec"><strong>General</strong><input placeholder="Record name" /><input placeholder="Owner" /></div><div class="formsec"><strong>Process control</strong><select><option>Active</option><option>Draft</option><option>Need review</option></select><textarea rows="3" placeholder="Note"></textarea></div><div class="actions"><button class="btn" id="closeBtn">Cancel</button><button class="btn primary" id="saveBtn">Save</button></div></div></div>
  <script>
    const modules={item_master:{label:"Item Master",subtitle:"Chuẩn hóa item, category, unit conversion",owner:"ERP Admin / Kỹ thuật / Thu mua",sheets:["🔹 Item master","⚙ Item category","⚙ Unit conversion"],kpis:[["Items","741","724 unique"],["Category","207","Top: Dây cuaroa"],["Unit rules","7","Active/Draft"],["Data quality","92%","Need UOM cleanup"]],cols:["Ma","Item name","Category","UOM","Status","Owner"],rows:[["ITM-0001","Ván MDF 1220x2440x18mm","Gỗ/Ván","tấm","Active","Kỹ thuật"],["ITM-0002","Bản lề inox 304","Phụ kiện","cái","Active","Thu mua"],["ITM-0003","Sơn PU clear coat","Hóa chất","lít","Need review","Kho"],["ITM-0004","Thùng carton export grade","Giấy/Carton","bộ","Active","Kho"],["ITM-0005","Mặt đá 1220x560x30mm","Đá","cái","Draft","Kỹ thuật"]],db:["item_master","item_categories","unit_conversions"]},product_development:{label:"Product Development",subtitle:"Theo dõi phát triển mẫu, BOM, trial, approval",owner:"R&D / Kỹ thuật / Sales",sheets:["Product brief","Sample request","BOM draft","Trial log"],kpis:[["Active projects","18","6 priority"],["Sample round","32","12 waiting QC"],["BOM draft","21","8 need cost"],["Approved","9","Ready for costing"]],cols:["Ma","Product","Customer","Stage","Owner","Due"],rows:[["PD-2406-001","Bathroom Vanity 36in","US Retailer","BOM draft","R&D","07/06"],["PD-2406-002","Outdoor Dining Set","EU Buyer","Sample round 2","Kỹ thuật","10/06"],["PD-2406-003","Oak Sideboard","Hospitality","Costing","Sales","12/06"],["PD-2406-004","Wardrobe KD","Distributor","Approved","R&D","15/06"]],db:["product_developments","sample_requests","bom_drafts","trial_logs"]},crm:{label:"CRM",subtitle:"Khách hàng, lead, opportunity, follow-up",owner:"Sales / Export team",sheets:["Account","Contact","Opportunity","Activity"],kpis:[["Accounts","46","US/EU buyers"],["Open opps","19","7 hot"],["Follow-up","31","Due this week"],["Quote value","$420k","Pipeline"]],cols:["Ma","Account","Region","Stage","Owner","Next action"],rows:[["CRM-001","Northstar Home","US","Quote","Sales","Send revised FOB"],["CRM-002","Nordic Living","EU","Sample","Export","Confirm finish sample"],["CRM-003","Pacific Sourcing","US","Negotiation","Sales","Margin review"],["CRM-004","Maison Contract","EU","Lead","BD","Intro catalog"]],db:["crm_accounts","crm_contacts","crm_opportunities","crm_activities"]}};
    const state={process:"item_master",view:"table",mode:"user",query:""};const views=[["overview","▦","Overview"],["table","▣","Operation table"],["dashboard","☷","Dashboard"],["report","▤","Report"]];const configRows=[["app_nav_items","Left nav / setting nav","≡ Nav, ≡ Setting Nav","Config"],["app_tables","Table index, screen view, summary","Table index","Config"],["app_fields","Field label, order, validation","Template table","Config"],["app_metrics","KPI cards / report config","Metric, Report config","Config"],["process_feedback","Manual feedback / improvement","Feedback","Operation"]];const tableIndex=[["Core","Item master","Operation","Table + form","741 rows, 207 categories"],["Core","Unit conversion","Operation","Table + form","7 conversion rules"],["Process","Product project","Operation","Kanban + table","PD lifecycle"],["Sales","CRM opportunity","Operation","Pipeline + activity","Account/opportunity/follow-up"],["General","Project info","Config","Setting form","Brand, user, objective"]];const qs=s=>document.querySelector(s),html=rows=>rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===4||i===3?`<span class="status ${c==="Active"?"ok":c==="Need review"?"warn":""}">${c}</span>`:c}</td>`).join("")}</tr>`).join("");
    function table(cols,rows){return `<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${html(rows)}</tbody></table>`}function bindNav(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.mode="user";state.view=b.dataset.view;render()});document.querySelector("[data-config]").onclick=()=>{state.mode="config";render()}}function render(){const m=modules[state.process];qs("#ctxName").textContent=m.label;qs("#ctxOwner").textContent=m.owner;qs("#title").textContent=state.mode==="config"?`${m.label} config app`:m.label;qs("#subtitle").textContent=state.mode==="config"?"Quan tri nav, table index, field config va rule theo process template latest.":m.subtitle;qs("#configBtn").classList.toggle("active",state.mode==="config");qs("#sheets").innerHTML=m.sheets.map(s=>`<span class="pill">${s}</span>`).join("");qs("#metrics").innerHTML=m.kpis.map(k=>`<div class="metric"><span>${k[0]}</span><strong>${k[1]}</strong><small>${k[2]}</small></div>`).join("");qs("#nav").innerHTML=views.map(v=>`<button class="${state.mode==="user"&&state.view===v[0]?"active":""}" data-view="${v[0]}">${v[1]} <span>${v[2]}</span></button>`).join("")+`<button class="${state.mode==="config"?"active":""}" data-config="1">⚙ <span>Config app</span></button>`;let rows=m.rows.filter(r=>r.join(" ").toLowerCase().includes(state.query));if(state.mode==="config"){qs("#content").innerHTML=`<div class="panel span"><div class="header"><h2>${m.label} template config tables</h2><span class="pill">Latest rule: process template app</span></div>${table(["Table","Purpose","Source","Type"],configRows)}<div class="panel" style="margin-top:14px"><div class="header"><h2>Table index preview</h2></div>${table(["Group","Table","Data type","Screen view","Summary"],tableIndex)}</div></div>`}else{qs("#content").innerHTML=`<div class="panel span"><div class="header"><h2>${m.label} ${state.view==="table"?"operation table":state.view}</h2><span class="pill">Full-screen process</span></div>${table(m.cols,rows)}</div><div class="panel"><div class="header"><h2>${m.label} guardrail</h2><span>✧</span></div><ul class="list"><li>Each process is a full screen app.</li><li>Left panel stays process-specific.</li><li>Table view is the default work surface.</li><li>Section-based forms for record create/edit.</li><li>Bottom-left icons switch process and config.</li></ul></div><div class="panel"><div class="header"><h2>DB model</h2><span>▣</span></div><div class="db">${["app_processes","app_nav_items","app_tables","app_fields",...m.db].map(x=>`<span>${x}</span>`).join("")}</div></div>`}bindNav()}
    Object.keys(modules).forEach(k=>{qs("#processSelect").innerHTML+=`<option value="${k}">${modules[k].label}</option>`;qs("#switcher").innerHTML+=`<button data-process="${k}">${modules[k].label}</button>`});qs("#processSelect").onchange=e=>{state.process=e.target.value;state.mode="user";state.view="table";render()};qs("#processBtn").onclick=()=>{qs("#switcher").hidden=!qs("#switcher").hidden};qs("#switcher").onclick=e=>{let b=e.target.closest("button");if(!b)return;state.process=b.dataset.process;qs("#processSelect").value=state.process;state.mode="user";state.view="table";qs("#switcher").hidden=true;render()};qs("#configBtn").onclick=()=>{state.mode=state.mode==="config"?"user":"config";qs("#switcher").hidden=true;render()};qs("#search").oninput=e=>{state.query=e.target.value.toLowerCase();render()};qs("#newBtn").onclick=()=>qs("#modal").classList.add("open");qs("#closeBtn").onclick=qs("#saveBtn").onclick=()=>qs("#modal").classList.remove("open");render();
  </script>
</body>
</html>
